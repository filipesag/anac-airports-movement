services:
  astro-cli:
    image: quay.io/astronomer/astro-runtime:10.0.0
    volumes:
      - .:/usr/local/airflow
    env_file:
      - .env

  spark:
    image: bitnami/spark:3.5.1
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark
      SPARK_LOCAL_DIRS: /tmp/spark
    volumes:
      - .:/usr/local/airflow  # Alterado para ser consistente
    ports:
      - "7077:7077"
      - "8081:8081"

  spark-worker:
    image: bitnami/spark:3.5.1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark:7077
      SPARK_LOCAL_DIRS: /tmp/spark
    volumes:
      - .:/usr/local/airflow  # Alterado para ser consistente